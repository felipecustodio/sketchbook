name: Generate thumbnails

on:
  push:
    branches:
      - main

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyvirtualdisplay mss Pillow
          playwright install --with-deps chromium
      - name: Generate thumbnails
        run: python scripts/generate_thumbnails.py
      - name: Commit thumbnail manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh sketch thumbnails'
          file_pattern: site/data/thumbnails.json
